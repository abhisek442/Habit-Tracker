<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef2fb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habits">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Habits</title>
<style>
:root{--bg:#eef2fb;--ink:#14161c;--mute:#6b7280;--acc:#0a84ff;--line:rgba(255,255,255,.75);--fill:rgba(255,255,255,.55);--glass:linear-gradient(150deg,rgba(255,255,255,.92),rgba(255,255,255,.7));--sh:0 6px 18px rgba(40,60,120,.1),inset 0 1px 0 rgba(255,255,255,.95);--r:24px}
:root.dark{--bg:#07080c;--ink:#f5f6fa;--mute:#9ca3b4;--line:rgba(255,255,255,.14);--fill:rgba(255,255,255,.08);--glass:linear-gradient(150deg,rgba(255,255,255,.14),rgba(255,255,255,.05));--sh:0 6px 18px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;height:100%;color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
:root{--b1:#a9d4ff;--b2:#ffc8e6;--b3:#c6f6dc;--b4:#ffe7b8;--sbg:#eef2fb}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 18% 12%,var(--b1) 0,transparent 38%),radial-gradient(circle at 88% 28%,var(--b2) 0,transparent 36%),radial-gradient(circle at 30% 88%,var(--b3) 0,transparent 40%),radial-gradient(circle at 92% 92%,var(--b4) 0,transparent 32%),var(--sbg)}
:root.dark body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:rgba(0,0,0,.72)}
#app{position:fixed;top:0;bottom:0;left:0;right:0;max-width:640px;margin:0 auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);overflow:hidden}
main{position:absolute;top:env(safe-area-inset-top);bottom:0;left:0;right:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;touch-action:pan-y;padding:20px 18px 130px;-webkit-overflow-scrolling:touch}
h1{font:800 36px/1.05 var(--hf);letter-spacing:-.035em;margin:18px 4px 6px}
.sub{color:var(--mute);margin:0 4px 20px;font-size:15px}
nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 28px);max-width:612px;display:flex;gap:4px;padding:6px;z-index:5;border-radius:32px;background:linear-gradient(150deg,rgba(255,255,255,.78),rgba(255,255,255,.45));border:1px solid var(--line);box-shadow:0 16px 40px rgba(40,60,120,.16),inset 0 1px 0 rgba(255,255,255,.95)}
:root.dark nav{background:linear-gradient(150deg,rgba(40,44,60,.7),rgba(20,22,32,.55))}
nav button{flex:1;border:0;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11px -apple-system,system-ui,sans-serif;cursor:pointer;padding:8px 0;border-radius:26px;transition:background .25s,color .25s}
nav button *{pointer-events:none}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc);background:rgba(255,255,255,.9);box-shadow:0 2px 10px rgba(40,60,120,.12)}
:root.dark nav button.on{background:rgba(255,255,255,.14);box-shadow:none}
.bar{height:10px;border-radius:6px;background:var(--fill);margin:0 4px 24px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 60%,#fff),var(--acc));transition:width .5s cubic-bezier(.2,.8,.2,1)}
.row{display:flex;align-items:center;gap:14px;background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px;margin-bottom:14px;box-shadow:var(--sh);transition:transform .2s}
.row:active{transform:scale(.98)}.row.off{opacity:.5}
.em{font-size:24px;width:52px;height:52px;display:grid;place-items:center;border-radius:18px;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 28%,#fff),color-mix(in srgb,var(--c) 12%,#fff));box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 4px 10px color-mix(in srgb,var(--c) 25%,transparent)}
:root.dark .em{background:color-mix(in srgb,var(--c) 22%,transparent)}
.grow{flex:1;min-width:0;cursor:pointer}
.nm{font-weight:650;font-size:17px;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{font-size:13.5px;color:var(--mute);margin-top:2px}
.ck{width:50px;height:50px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 55%,transparent);background:rgba(255,255,255,.5);color:var(--c);font:700 13px -apple-system,system-ui,sans-serif;cursor:pointer;flex:none;transition:background .25s,transform .15s,box-shadow .25s;box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
:root.dark .ck{background:rgba(255,255,255,.06)}
.ck:active{transform:scale(.88)}
.ck.on{background:linear-gradient(145deg,color-mix(in srgb,var(--c) 85%,#fff),var(--c));border-color:transparent;color:#fff;font-size:20px;box-shadow:0 6px 16px color-mix(in srgb,var(--c) 45%,transparent),inset 0 1px 0 rgba(255,255,255,.5)}
.fab{position:fixed;left:calc(50% - 31px);display:grid;place-items:center;padding:0;line-height:0;bottom:calc(100px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;border:1px solid rgba(255,255,255,.7);background:linear-gradient(145deg,color-mix(in srgb,var(--acc) 72%,#fff),var(--acc));color:#fff;font:300 36px/1 -apple-system,system-ui,sans-serif;box-shadow:0 14px 30px color-mix(in srgb,var(--acc) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.5);cursor:pointer;z-index:4;transition:transform .15s}
.fab:active{transform:scale(.92)}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:12px 8px;box-shadow:var(--sh)}
th{font:600 11px -apple-system,system-ui,sans-serif;color:var(--mute);padding:4px 0;text-transform:uppercase;letter-spacing:.05em}
td{text-align:center;padding:8px 0}
td.n{text-align:left;font-size:15px;font-weight:600;padding-left:10px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d{display:inline-block;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:var(--fill);cursor:pointer}
.d.s{border-color:color-mix(in srgb,var(--c) 60%,transparent)}.d.on{background:linear-gradient(145deg,color-mix(in srgb,var(--c) 85%,#fff),var(--c));border-color:transparent;box-shadow:0 3px 8px color-mix(in srgb,var(--c) 40%,transparent)}.d.na{border:0;background:none;box-shadow:none;cursor:default}
.tdy{color:var(--acc)}
.sc{display:flex;gap:12px}.sc>div{flex:1;background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:18px 8px;text-align:center;box-shadow:var(--sh)}
.sc b{font:800 30px var(--hf);letter-spacing:-.03em;display:block}.sc span{font-size:12px;color:var(--mute);font-weight:600}
.heat{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin-top:14px}.heat i{aspect-ratio:1;border-radius:5px;background:var(--fill)}.heat i.on{background:linear-gradient(145deg,color-mix(in srgb,var(--c) 85%,#fff),var(--c))}.heat i.na{opacity:.35}
.wk{display:flex;gap:10px;height:110px;padding:0 4px}.wk>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--mute)}.wk i{width:100%;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 60%,#fff),var(--acc));border-radius:8px 8px 4px 4px;min-height:4px}
label{display:block;font-size:12.5px;font-weight:700;color:var(--mute);margin:22px 0 8px 8px;text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=number],input[type=time],input[type=email],input[type=password],textarea{width:100%;font:inherit;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--glass);color:var(--ink);outline:none;box-shadow:var(--sh)}
select{font:inherit;padding:13px 16px;border-radius:16px;border:1px solid var(--line);background:var(--glass);color:var(--ink);box-shadow:var(--sh)}
input:focus,textarea:focus,select:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 35%,transparent)}
textarea{min-height:100px;resize:vertical}
input[type=color]{width:44px;height:36px;border:0;background:none;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chips button{min-width:46px;height:46px;border-radius:16px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:inherit;font-size:15px;cursor:pointer;box-shadow:var(--sh);transition:transform .15s}
.chips button:active{transform:scale(.94)}
.chips button.on{background:var(--acc);color:#fff;font-weight:700;border-color:transparent;box-shadow:0 6px 16px color-mix(in srgb,var(--acc) 35%,transparent)}
.sw button{width:38px;height:38px;min-width:0;border-radius:50%;border:2px solid rgba(255,255,255,.9)}
.sw button.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.btn{font:650 16px -apple-system,system-ui,sans-serif;border:0;border-radius:18px;padding:15px 24px;background:linear-gradient(145deg,color-mix(in srgb,var(--acc) 72%,#fff),var(--acc));color:#fff;cursor:pointer;box-shadow:0 10px 24px color-mix(in srgb,var(--acc) 30%,transparent),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5}
.btn.g{background:var(--glass);color:var(--acc);border:1px solid var(--line);box-shadow:var(--sh)}
.btn.r{background:rgba(255,59,48,.12);color:#ff3b30;box-shadow:none;border:1px solid rgba(255,59,48,.2)}
.acts{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
.empty{text-align:center;color:var(--mute);padding:70px 10px;font-size:16px}
.cat{margin:24px 0 10px 8px;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
body.dense .row{padding:11px 14px;margin-bottom:10px}
a{color:var(--acc);text-decoration:none;font-weight:600;padding:4px 2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.sec{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:28px 0 8px 16px}
.grp{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;min-height:54px}
.frow+.frow,.frow+button.link,button.link+button.link,.frow+.frow-tight{border-top:.5px solid var(--line)}
.lb{font-size:16px;font-weight:550}
.hint{font-size:13px;color:var(--mute);margin-top:2px}
.grp select{border:0;border-radius:12px;padding:8px 12px;background:var(--fill);color:var(--ink);font:500 15px -apple-system,system-ui,sans-serif;box-shadow:none;max-width:60%}
.grp input[type=email],.grp input[type=password]{border:0;border-radius:0;box-shadow:none;background:none;padding:14px 16px;font-size:16px;border-top:.5px solid var(--line);}
.grp input[type=email]:first-child,.grp .frow:first-child{border-top:0}
.link{display:block;width:100%;text-align:left;background:none;border:0;font:600 16px -apple-system,system-ui,sans-serif;color:var(--acc);padding:14px 16px;cursor:pointer}
.link:active{background:var(--fill)}
.link.red{color:#ff3b30}
.grp .sw{justify-content:flex-end}
.grp .sw button{width:30px;height:30px}
.grp .fbtns{display:flex;gap:10px;padding:12px 16px 14px}
.grp .fbtns button{flex:1}

.pk{display:flex;align-items:center;gap:8px;max-width:60%;background:var(--fill);border:0;border-radius:12px;padding:8px 12px;font:500 15px -apple-system,system-ui,sans-serif;color:var(--ink);cursor:pointer;white-space:nowrap}
.pk span{overflow:hidden;text-overflow:ellipsis}
.pk svg{width:12px;height:12px;stroke:var(--mute);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,14,30,.28);display:flex;align-items:flex-end;justify-content:center;animation:fdi .2s ease}
.sh{width:100%;max-width:620px;margin:0 10px calc(10px + env(safe-area-inset-bottom));border-radius:30px;padding:12px;background:linear-gradient(150deg,rgba(255,255,255,.93),rgba(255,255,255,.78));border:1px solid var(--line);box-shadow:0 24px 60px rgba(20,30,70,.28);animation:sup .3s cubic-bezier(.2,.8,.2,1);max-height:80vh;overflow:auto}
:root.dark .sh{background:linear-gradient(150deg,rgba(54,58,76,.95),rgba(28,30,42,.93))}
.sh h3{margin:6px 12px 10px;font-size:14px;color:var(--mute);text-align:center;font-weight:600}
.so{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:none;padding:15px 16px;border-radius:16px;font:500 17px -apple-system,system-ui,sans-serif;color:var(--ink);cursor:pointer}
.so+.so{margin-top:2px}
.so:active{background:var(--fill)}
.so.on{color:var(--acc);font-weight:700}
.so.on::after{content:"";width:9px;height:16px;border:solid var(--acc);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-2px,-2px)}
.sh .btn{width:100%;margin-top:10px}
.tp{display:flex;gap:10px;height:260px;margin:4px 0 4px}
.tp>div{flex:1;overflow-y:auto;border-radius:18px;background:var(--fill);padding:6px;scrollbar-width:none}
.tp button{display:block;width:100%;height:42px;border:0;border-radius:12px;background:none;font:600 18px -apple-system,system-ui,sans-serif;color:var(--ink);cursor:pointer}
.tp button.on{background:var(--acc);color:#fff}
.tp .cap{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);text-align:center;padding:6px 0}
.tbt{display:flex;gap:10px}.tbt .btn{flex:1;margin-top:10px}
@keyframes sup{from{transform:translateY(40px);opacity:0}}
@keyframes fdi{from{opacity:0}}

:root[data-skin=sunset]{--b1:#ffd0a6;--b2:#ff9ec0;--b3:#ffe29a;--b4:#ffb199;--sbg:#fff3ea}
:root[data-skin=mint]{--b1:#b8f0d8;--b2:#a9e4ff;--b3:#d7f7b8;--b4:#fff3b0;--sbg:#effaf4}
:root[data-skin=lavender]{--b1:#d5c4ff;--b2:#ffc4ea;--b3:#bcd6ff;--b4:#f0d9ff;--sbg:#f4f0ff}
:root[data-skin=ocean]{--b1:#8fd3ff;--b2:#9fb4ff;--b3:#a6f0e6;--b4:#d4ecff;--sbg:#eaf6ff}
:root[data-skin=rose]{--b1:#ffb3c6;--b2:#ffd0b0;--b3:#f3b8ff;--b4:#ffe0ea;--sbg:#fff0f3}
:root[data-skin=graphite]{--b1:#d9dde6;--b2:#e6e1ea;--b3:#d6e2e0;--b4:#eceae2;--sbg:#f1f2f5}
.ck{position:relative}.ck svg{display:block;margin:auto}
.chk{stroke-dasharray:22;stroke-dashoffset:0}
.ck.pop{animation:pp .45s cubic-bezier(.2,.9,.3,1.4)}
.ck.pop .chk{animation:dr .4s .05s ease-out both}
.ck.pop::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--c);animation:rg .6s ease-out forwards;pointer-events:none}
@keyframes pp{0%{transform:scale(.8)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes dr{from{stroke-dashoffset:22}to{stroke-dashoffset:0}}
@keyframes rg{from{transform:scale(1);opacity:.8}to{transform:scale(1.9);opacity:0}}
.tip{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:12px 16px;margin:0 0 16px;font-size:14.5px;color:var(--mute);box-shadow:var(--sh)}
.row .st a{font-size:13px}
.lvn{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;font:800 24px var(--hf);color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--acc) 72%,#fff),var(--acc));box-shadow:0 6px 16px color-mix(in srgb,var(--acc) 40%,transparent)}
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bgt{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:14px 6px;text-align:center;box-shadow:var(--sh)}
.bgt div{font-size:28px}.bgt b{display:block;font-size:13px;margin-top:4px}.bgt span{display:block;font-size:11px;color:var(--mute);margin-top:2px}
.bgt.lock{opacity:.4;filter:grayscale(1)}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:60;padding:12px 20px;border-radius:24px;background:rgba(255,255,255,.94);color:#14161c;font-weight:600;font-size:15px;box-shadow:0 12px 32px rgba(20,30,70,.22);animation:tin .35s cubic-bezier(.2,.9,.3,1.2);white-space:nowrap}
:root.dark .toast{background:rgba(44,48,66,.96);color:#fff}
@keyframes tin{from{opacity:0;transform:translate(-50%,-14px)}}

body::before{transform:translateZ(0)}
nav{-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.sh{-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px)}
.row,.grp,.bgt,.tip,table{contain:layout style}
.cc{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.9);background:conic-gradient(#ff3b30,#ff9500,#ffcc00,#34c759,#00c7be,#007aff,#af52de,#ff2d55,#ff3b30);cursor:pointer;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.15);padding:0}
.cc::after{content:"+";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:700 20px/1 -apple-system,system-ui,sans-serif;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.chips button.cc{background:conic-gradient(#ff3b30,#ff9500,#ffcc00,#34c759,#00c7be,#007aff,#af52de,#ff2d55,#ff3b30);width:38px;height:38px;min-width:0;padding:0;border:2px solid rgba(255,255,255,.9)}
.cpv{width:74px;height:74px;border-radius:24px;margin:6px auto 14px;box-shadow:0 8px 20px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.5)}
.cps{display:flex;align-items:center;gap:12px;margin:12px 8px}
.cps span{width:48px;font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.cps input{flex:1;-webkit-appearance:none;appearance:none;height:14px;border-radius:7px;outline:none;padding:0;border:0;background:var(--tr);box-shadow:inset 0 0 0 1px var(--line)}
.cps input::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.cps input::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0}
.nc{display:flex;gap:8px;margin:10px 0 4px}.nc input{flex:1}.nc .btn{width:auto;margin:0;padding:12px 18px}

.wbar{display:flex;align-items:center;gap:14px;margin:12px 4px 16px}.wbar>div{flex:1}.wbar b{font:700 20px var(--hf);display:block}
.rtp{flex:none!important;border:0;border-radius:18px;padding:10px 14px;background:var(--acc);color:#fff;font:700 15px -apple-system,system-ui,sans-serif;box-shadow:0 6px 16px color-mix(in srgb,var(--acc) 40%,transparent);cursor:pointer}
.ex{margin-bottom:14px}.sets{padding:0 12px 4px;--n:2}
.sh2,.sr{display:grid;grid-template-columns:28px 1.2fr repeat(var(--n),1fr) 40px;gap:8px;align-items:center}
.sh2{font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;text-align:center;padding:4px 0}
.sr{margin:8px 0}.sr .sn{text-align:center;font-weight:700;color:var(--mute)}.sr .pv{text-align:center;font-size:13px;color:var(--mute)}
.sr input{padding:10px 2px;text-align:center;font-size:16px;border-radius:12px;box-shadow:none;min-width:0}.sr.dn input{opacity:.5}
.sck{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--fill);cursor:pointer;position:relative;padding:0}
.sck.on{background:var(--acc);border-color:transparent}.sck.on::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:700 16px/1 -apple-system,system-ui,sans-serif}
.xg{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin:12px 10px 4px}.xl{max-height:44vh;overflow:auto;margin:8px 0}

function week(){const ws=+S.set.ws,t=new Date();t.setHours(12);
 const st=day(-((t.getDay()-ws+7)%7)+off*7),ds=[...Array(7)].map((_,i)=>{const d=new Date(st);d.setDate(st.getDate()+i);return d});
 const fmt=d=>d.toLocaleDateString(undefined,{month:'short',day:'numeric'});
 return`<h1>Week</h1><p class="sub"><a href="#" data-o="-1">‹ Prev</a> &nbsp; ${fmt(ds[0])} – ${fmt(ds[6])} &nbsp; <a href="#" data-o="1">Next ›</a></p>
 ${S.habits.length?`<table><tr><th></th>${ds.map(d=>`<th class="${key(d)===key(new Date())?'tdy':''}">${DN[d.getDay()]}<br>${d.getDate()}</th>`).join('')}</tr>
 ${S.habits.map(h=>`<tr style="--c:${h.color}"><td class="n">${esc(h.emoji)} ${esc(h.name)}</td>${ds.map(d=>{const k=key(d),s=sched(h,d),f=d>new Date()&&key(d)!==key(new Date());
  return`<td><span class="d ${s?'s':'na'} ${done(h,k)?'on':''}" ${s&&!f?`data-w="${h.id}|${k}"`:''}></span></td>`}).join('')}</tr>`).join('')}</table>`:'<div class="empty">Add a habit to see your week.</div>'}`}
function stats(){if(!S.habits.length)return'<h1>Stats</h1><div class="empty">Nothing to show yet.</div>';
 let tot=0,dn=0;S.habits.forEach(h=>{for(let i=0;i<30;i++){const d=day(-i);if(sched(h,d)){tot++;if(done(h,key(d)))dn++}}});
 return`<h1>Stats</h1>${lvl()}<div style="height:16px"></div><p class="sub">Last 30 days</p>
 <div class="sc"><div><b>${tot?Math.round(dn/tot*100):0}%</b><span>completion</span></div><div><b>${dn}</b><span>check-ins</span></div><div><b>${Math.max(...S.habits.map(h=>streak(h)[0]))}</b><span>top streak</span></div></div>
 ${wk()}${bdg()}${nts()}<div style="height:16px"></div>
 <div class="g2">${S.habits.map(h=>{const[s,b]=streak(h);return`<div class="row" style="--c:${h.color};display:block"><div style="display:flex;gap:10px;align-items:center"><span style="font-size:20px">${esc(h.emoji)}</span><b class="grow nm">${esc(h.name)}</b><span class="st">🔥${s} · best ${b}</span></div>
 <div class="heat">${[...Array(45)].map((_,i)=>{const d=day(i-44),k=key(d);return`<i class="${done(h,k)?'on':sched(h,d)?'':'na'}"></i>`}).join('')}</div></div>`}).join('')}</div>`}
function settings(){if(!SV)return profileView();const s=S.set,opt=(id,v,list)=>`<select id="${id}">${list.map(([x,l])=>`<option value="${x}" ${String(v)===String(x)?'selected':''}>${l}</option>`).join('')}</select>`;
 const nOn=!!(window.Capacitor||('Notification'in window&&Notification.permission==='granted'));
 return`<p class="sub" style="margin:8px 4px 0"><a data-sb="1">‹ Profile</a></p><h1>Settings</h1><p class="sub">Saved on this device, and in your account when you log in.</p>
 ${acct()}
 
 <div class="sec">Appearance</div><div class="grp">
  <div class="frow"><span class="lb">Style</span>${opt('sk',s.skin,Object.entries(SKN).map(([k,v])=>[k,v.n]))}</div>
  <div class="frow"><span class="lb">Theme</span>${opt('th',s.theme,[['auto','Automatic'],['light','Light'],['dark','Dark']])}</div>
  <div class="frow"><span class="lb">Accent</span><div class="chips sw">${COL.map(c=>`<button data-a="${c}" style="background:${c}" class="${s.accent===c?'on':''}" aria-label="${c}"></button>`).join('')}<button type="button" class="cc" id="ac" aria-label="Custom colour"></button></div></div>
  <div class="frow"><span class="lb">Heading font</span>${opt('fo',s.font,[['sf','System'],['serif','Serif'],['round','Rounded'],['mono','Mono']])}</div>
  <div class="frow"><span class="lb">Layout</span>${opt('dn',+s.dense,[[0,'Comfortable'],[1,'Compact']])}</div>
 </div>
 <div class="sec">Home</div><div class="grp">
  <div class="frow"><span class="lb">Open on</span>${opt('sr',s.start,[['today','Today'],['week','Week'],['stats','Stats']])}</div>
  <div class="frow"><span class="lb">Daily tip</span>${opt('tp',+s.tip,[[1,'Show'],[0,'Hide']])}</div>
  <div class="frow"><span class="lb">Week starts on</span>${opt('ws',s.ws,[[1,'Monday'],[0,'Sunday'],[6,'Saturday']])}</div>
 </div>
 <div class="sec">Reminders</div><div class="grp">
  <div class="frow"><div><div class="lb">Notifications</div><div class="hint">Habits with a reminder time will notify you.</div></div><button class="btn g" id="nb" style="padding:10px 14px;font-size:15px">${nOn?'On':'Allow'}</button></div>
 </div>
 <div class="sec">Security</div><div class="grp"><div class="frow"><div><div class="lb">App lock</div><div class="hint">${LK()?'On. Asks for your PIN to open the app.':'Ask for a PIN or fingerprint to open the app.'}</div></div><button class="btn g" id="lkb" style="padding:10px 14px;font-size:15px">${LK()?'Manage':'Set up'}</button></div></div>
 <div class="sec">Workouts</div><div class="grp"><div class="frow"><span class="lb">Weight unit</span>${opt('un',s.unit,[['kg','Kilograms'],['lb','Pounds']])}</div><div class="frow"><span class="lb">Rest timer</span>${opt('rst',+s.rest,[[0,'Off'],[30,'30 sec'],[60,'60 sec'],[90,'90 sec'],[120,'2 min'],[180,'3 min']])}</div></div>
 ${inst()}
 <div class="sec">Data</div><div class="grp">
  ${PV()}<button class="link" id="obr">Replay intro</button>
  <button class="link" id="ex">Export backup</button>
  <button class="link" id="im">Import backup</button>
  <input type="file" id="fi" accept=".json" hidden>
  <button class="link red" id="rs">Erase all data</button>
 </div>
 <p class="hint" style="margin:14px 16px">Habit Tracker keeps your data private. Only your account can read it.</p>`}

function form(){const h=edit;return`<h1>${h.isNew?'New habit':'Edit habit'}</h1>
 <label>Name</label><input type="text" id="fn" maxlength="40" value="${esc(h.name)}" placeholder="e.g. Drink water">
 <label>Type</label><div class="chips" id="fty">${[['build','Build'],['avoid','Avoid'],['timed','Timed']].map(([k,l])=>`<button data-ty="${k}" class="${(h.type||'build')===k?'on':''}">${l}</button>`).join('')}</div><p class="hint" style="margin:8px 8px 0">${{build:'Something you want to do.',avoid:'Something you want to stay away from. You stay on track until you log a slip.',timed:'Do it for a set number of minutes with a built-in timer.'}[h.type||'build']}</p>
 <label>Category (optional)</label><button type="button" class="pk" id="fcat" style="max-width:100%;width:100%;justify-content:space-between"><span>${esc(h.cat||'None')}</span>${CHV}</button>
 ${(h.type||'build')==='build'?`<label>Daily goal (times per day)</label><input type="number" id="fgoal" min="1" max="99" value="${h.goal||1}">`:''}${h.type==='timed'?`<label>Minutes</label><input type="number" id="fmin" min="1" max="600" value="${h.mins||10}">`:''}
 <label>Icon (tap one or type your own)</label><div class="chips" id="fe">${EMO.map(e=>`<button data-v="${e}" class="${h.emoji===e?'on':''}">${e}</button>`).join('')}<input type="text" id="fx" maxlength="2" style="width:70px" value="${EMO.includes(h.emoji)?'':esc(h.emoji)}"></div>
 <label>Colour</label><div class="chips sw" id="fc">${COL.map(c=>`<button data-v="${c}" style="background:${c}" class="${h.color===c?'on':''}"></button>`).join('')}</div>
 <label>Custom colour</label><div class="chips"><button type="button" class="cc" id="fcc" aria-label="Pick any colour"></button></div><label>Repeat on</label><div class="chips" id="fd">${DN.map((n,i)=>`<button data-v="${i}" class="${h.days.includes(i)?'on':''}">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][i]}</button>`).join('')}</div>
 <label>Reminders</label><div class="chips" id="frs">${rts(h).map((t,i)=>`<button data-rm="${i}">${t} ✕</button>`).join('')}<button data-add="1">+ Add time</button></div><label>Friends</label><div class="chips"><button type="button" id="fsh" class="${h.share?'on':''}">${h.share?'Shared with friends':'Share with friends'}</button></div>
 <div class="acts"><button class="btn" id="sv">Save</button><button class="btn g" id="cn">Cancel</button>${h.isNew?'':'<button class="btn r" id="dl">Delete</button>'}</div>`}
function bindForm(){const h=edit;
 const grp=(id,fn)=>$(id).onclick=e=>{const b=e.target.closest('button');if(b){fn(b.dataset.v);render()}};
 const keep=()=>{h.name=$('#fn').value;if($('#fgoal'))h.goal=Math.max(1,Math.min(99,+$('#fgoal').value||1));if($('#fmin'))h.mins=Math.max(1,Math.min(600,+$('#fmin').value||10));const x=$('#fx').value.trim();if(x)h.emoji=x};
 $('#fn').oninput=()=>h.name=$('#fn').value;$('#fx').oninput=()=>{const x=$('#fx').value.trim();if(x)h.emoji=x};
 grp('#fe',v=>{keep();h.emoji=v;$('#fx').value=''});grp('#fc',v=>{keep();h.color=v});
 grp('#fd',v=>{keep();v=+v;const i=h.days.indexOf(v);i<0?h.days.push(v):h.days.splice(i,1)});
 $('#cn').onclick=()=>{edit=null;render()};
 $('#fty').onclick=e=>{const b=e.target.closest('button');if(!b)return;keep();h.type=b.dataset.ty;render()};$('#fsh').onclick=()=>{keep();h.share=!h.share;render()};
 $('#fcat').onclick=()=>{keep();pickCat(h.cat,c=>{h.cat=c;render()})};$('#fcc').onclick=()=>{keep();pickColor(h.color,c=>{h.color=c;render()})};
 $('#frs').onclick=e=>{const b=e.target.closest('button');if(!b)return;keep();if(b.dataset.rm!==undefined){h.rts=rts(h).filter((_,i)=>i!==+b.dataset.rm);render()}else pickTime('',t=>{if(!rts(h).includes(t))h.rts=[...rts(h),t].sort();render()})};
 $('#sv').onclick=()=>{keep();if(!h.name.trim()){$('#fn').focus();return}if(!h.days.length)h.days=[0,1,2,3,4,5,6];
  const o={id:h.id,name:h.name.trim(),emoji:h.emoji||'⭐',color:h.color,days:h.days,created:h.created,cat:h.cat,goal:(h.type==='avoid'||h.type==='timed')?1:h.goal,type:h.type||'build',mins:h.mins||10,share:!!h.share,rts:rts(h)};
  h.isNew?S.habits.push(o):S.habits[S.habits.findIndex(x=>x.id===h.id)]=o;save();edit=null;render()};
 if($('#dl'))$('#dl').onclick=()=>{ask('Delete habit?','This habit and all its history will be removed.','Delete',()=>{S.habits=S.habits.filter(x=>x.id!==h.id);for(const k in S.log){S.log[k]=S.log[k].filter(i=>i!==h.id);if(!S.log[k].length)delete S.log[k]}save();edit=null;render()})}}
function bind(){const v=$('#v');v.oninput=woInput;v.onkeydown=e=>{if(tab==='set'&&!SV&&e.key==='Enter'&&e.target.id==='fcode')frClick(null,a=>a==='data-fa'?'1':null)};v.onpointerdown=dragStart;v.onpointermove=dragMove;v.onpointerup=v.onpointercancel=dragEnd;
 v.onclick=e=>{const t=e.target,g=a=>t.closest('['+a+']'),q=a=>g(a)&&g(a).getAttribute(a);
  if(tab==='wo')return woClick(g,q);
  if(tab==='set'&&!SV)return frClick(g,q);
  if(q('data-sb')){SV=false;render();if(A)loadFriends(null,true);return}
  if(q('data-s'))skip(q('data-s'),1);
  else if(q('data-u'))skip(q('data-u'),0);
  else if(q('data-rest'))restDay();
  else if(q('data-go')){tab=q('data-go');render()}
  else if(q('data-c'))tap(q('data-c'),key(new Date()));
  else if(q('data-e')){const h=S.habits.find(x=>x.id===q('data-e'));edit={...h,days:[...h.days]};render()}
  else if(g('data-new')){edit={isNew:1,id:'h'+Date.now().toString(36),name:'',emoji:'💧',color:S.set.accent,days:[0,1,2,3,4,5,6],created:key(new Date()),cat:'',goal:1,rt:''};render()}
  else if(q('data-w')){const[i,k]=q('data-w').split('|');tap(i,k)}
  else if(g('data-o')){e.preventDefault();off+=+q('data-o');render()}
  else if(q('data-a')){S.set.accent=q('data-a');save();render()}};
 if($('#nt'))$('#nt').oninput=e=>{const x=e.target.value,k=key(new Date());x?S.notes[k]=x:delete S.notes[k];save()};
 if(tab!=='set'||!SV)return;
 $('#th').onchange=e=>{S.set.theme=e.target.value;save();render()};
 if($('#li')){$('#li').onclick=()=>login('in');$('#su').onclick=()=>login('up')}
 if($('#sy')){$('#sy').onclick=()=>{msg='Syncing…';render();sync()};$('#lo').onclick=()=>{setA(null);SYNCED=false;FD=null;msg='';render()}}
 if($('#in'))$('#in').onclick=async()=>{DEF.prompt();try{await DEF.userChoice}catch(e){}DEF=null;render()};
 $('#un').onchange=e=>{S.set.unit=e.target.value;save()};$('#rst').onchange=e=>{S.set.rest=+e.target.value;save()};
 $('#lkb').onclick=lockSettings;$('#obr').onclick=onboard;if($('#rvp'))$('#rvp').onclick=restorePrev;
 $('#sk').onchange=e=>{S.set.skin=e.target.value;S.set.accent=SKN[e.target.value].a;save();render()};$('#tp').onchange=e=>{S.set.tip=+e.target.value;save()};
 $('#fo').onchange=e=>{S.set.font=e.target.value;save();theme()};$('#dn').onchange=e=>{S.set.dense=+e.target.value;save();theme()};$('#sr').onchange=e=>{S.set.start=e.target.value;save()};
 $('#nb').onclick=()=>{window.Capacitor?native().then(()=>toast('🔔 Reminders scheduled')):'Notification'in window?Notification.requestPermission().then(()=>render()):toast('Notifications are not supported here.')};
 $('#ws').onchange=e=>{S.set.ws=+e.target.value;save()};
 $('#ac').onclick=()=>pickColor(S.set.accent,c=>{S.set.accent=c;save();render()});
 $('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='habits-backup.json';a.click()};
 $('#im').onclick=()=>$('#fi').click();
 $('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.habits||!d.log)throw 0;S=fix(d);save();render()}catch(x){toast('That file is not a valid backup.')}};r.readAsText(f)};
 $('#rs').onclick=()=>ask('Erase all data?',A?'Every habit, workout and note will be deleted from this device AND from your account. You can still restore it from this device afterwards.':'Every habit, workout and note on this device will be deleted.','Erase everything',()=>{snap('before erase',S);S=fix({habits:[],log:{},set:S.set});save();render()})}
render();
matchMedia('(prefers-color-scheme:dark)').onchange=theme;
setInterval(remind,30000);document.addEventListener('visibilitychange',remind);remind();if(A)sync();checkBadges();if(LK())lockNow();if(!S.set.onb)onboard();
if('serviceWorker'in navigator&&!window.Capacitor)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
